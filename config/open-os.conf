# ==============================================================================
# Open OS - Master Configuration File
# Location: /etc/open-os/open-os.conf or ./config/open-os.conf
# ==============================================================================
# You can modify any setting below at any time to customize Open OS behavior.

# --- Core Platform Settings ---
OS_NAME="Open OS (Kali Cyber Edition)"
OS_VERSION="1.0.0-rolling"
OS_CODENAME="CyberUniversal"

# --- Compatibility Engines ---
# Enable Android App Execution (.apk) via Waydroid LXC container
ENABLE_ANDROID_ENGINE=true

# Enable Windows Binary Execution (.exe / .msi) via Wine-Staging + Proton
ENABLE_WINDOWS_ENGINE=true

# Enable Linux Universal App formats (Flatpak, AppImage)
ENABLE_FLATPAK=true
ENABLE_APPIMAGE=true

# --- Desktop & Display Server ---
# Wayland is required for high-performance Waydroid integration.
# Options: "sway" (Ultra lightweight & fast for VMs), "gnome-wayland", "xfce-wayfire"
DESKTOP_SESSION="xfce-wayfire"
ENABLE_AUTO_WAYLAND=true

# --- Cyber Security & Pentesting Profile ---
# Toolset options: "top10" (Lightweight), "default" (Standard), "mobile-pentest" (Specialized)
KALI_TOOLSET="mobile-pentest"

# Auto-configure ADB bridge for Waydroid on startup
ENABLE_WAYDROID_ADB=true
WAYDROID_ADB_PORT=5555

# Auto-configure Burp Suite / ZAP Proxy helper for mobile traffic interception
ENABLE_PENTEST_PROXY_HELPER=true
DEFAULT_BURP_PROXY_HOST="192.168.240.1"
DEFAULT_BURP_PROXY_PORT="8080"

# Auto-install and manage Frida-Server inside the Android container
ENABLE_FRIDA_INTEGRATION=true

# --- UI & UX Preferences ---
ENABLE_CONTEXT_MENU_INTEGRATION=true
ENABLE_DESKTOP_NOTIFICATIONS=true
DARK_MODE=true
